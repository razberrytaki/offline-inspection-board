name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_DATABASE_URL: postgres://postgres:dev@127.0.0.1:5432/oib?sslmode=disable

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: oib
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: oib
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run --cwd web check
      - run: bun run --cwd web test
      - run: bun run --cwd web playwright install --with-deps chromium
      - run: bun run --cwd web test:e2e
      - run: go test -tags embed -count=1 -run '^TestEmbeddedBinary$' ./cmd/server
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t offline-inspection-board .
