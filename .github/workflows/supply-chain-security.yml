name: Supply Chain Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  socket-firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --cwd web --frozen-lockfile --ignore-scripts
